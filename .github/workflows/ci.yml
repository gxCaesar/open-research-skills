name: tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install tested dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run repository contracts
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run package tests
        run: |
          python -B -m unittest discover -s packages/conference-manuscripts/tests -p 'test_*.py' -v
          python -B -m unittest discover -s packages/journal-manuscripts/tests -p 'test_*.py' -v
          python -B -m unittest discover -s packages/research-funding-proposals/tests -p 'test_*.py' -v
          python -B -m unittest discover -s packages/research-publication-workflow/tests -p 'test_*.py' -v
          python -B -m unittest discover -s packages/scientific-visualizations/tests -p 'test_*.py' -v
      - name: Scan the complete public candidate
        run: python -B scripts/check_public_content.py .
